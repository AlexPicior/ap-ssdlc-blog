name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

env:
  LYCHEE_VERSION: v0.24.2
  GITLEAKS_VERSION: 8.21.2

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A secret scanner that fails the build if a secret appears in the
      # tree or in the PR's commits. gitleaks is pinned to an exact version.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
          gitleaks version

      - name: Scan for secrets
        run: |
          set -euo pipefail
          # Scan the whole working tree. Any finding exits non-zero and fails
          # the build. --redact keeps the secret value out of the logs.
          gitleaks detect --source . --no-banner --redact --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # scripts/linkcheck.mjs shells out to the lychee binary, so put a
      # pinned lychee on PATH first. One link-check implementation runs the
      # same way locally and in CI. lychee is distributed as a binary, not
      # an npm package (https://github.com/lycheeverse/lychee).
      - name: Install lychee
        run: |
          set -euo pipefail
          curl -sfLO "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf lychee-x86_64-unknown-linux-gnu.tar.gz
          # The binary may sit at the archive root or in a lychee-* subfolder.
          BIN="$(find . -maxdepth 2 -type f -name lychee | head -n1)"
          if [ -z "$BIN" ]; then
            echo "lychee binary not found in archive" >&2
            exit 1
          fi
          sudo install -m 0755 "$BIN" /usr/local/bin/lychee
          rm -rf lychee-x86_64-unknown-linux-gnu.tar.gz "$(dirname "$BIN")"/lychee* 2>/dev/null || true
          lychee --version

      # Internal link check only (--offline, inside the script). Any broken
      # internal link fails the job. External links are not checked here;
      # the Health workflow handles those as a soft check.
      - name: Internal link check
        run: npm run linkcheck
